<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HK Leaders · WoW Forever</title>
  <style>
    :root {
      --bg: #14110d;
      --panel: #1e1a14;
      --line: #3a3126;
      --text: #e8dcc2;
      --muted: #9a8c70;
      --gold: #f0b323;
      --alliance: #4a8fe7;
      --horde: #d6453d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { max-width: 980px; margin: 0 auto; padding: 40px 16px; }
    .wrap { overflow-x: auto; }
    table { min-width: 720px; }
    tr[hidden] { display: none; }
    .toggle {
      background: none; border: 0; padding: 0; color: inherit; font: inherit;
      font-variant-numeric: tabular-nums; cursor: pointer;
      border-bottom: 1px dotted var(--muted);
    }
    .toggle:hover { color: var(--gold); }
    tr.breakdown td { background: #191510; padding: 10px 14px 14px; }
    .chips { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .chips li {
      border: 1px solid var(--line); border-radius: 999px;
      padding: 3px 10px; font-size: 0.85rem; color: var(--text);
    }
    h1 { margin: 0 0 4px; color: var(--gold); letter-spacing: 0.04em; }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: normal; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }

    /* Sortable headers: the arrow space is always reserved so columns don't shift. */
    .sort {
      background: none; border: 0; padding: 0; cursor: pointer;
      font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    }
    .sort:hover, .sort:focus-visible { color: var(--gold); }
    .sort::after { content: " ▼"; visibility: hidden; font-size: 0.7em; }
    th[aria-sort="ascending"] .sort::after { content: " ▲"; visibility: visible; }
    th[aria-sort="descending"] .sort::after { visibility: visible; }
    th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--text); }

    .rank { width: 48px; color: var(--muted); }
    tr.first .rank, tr.first .hk { color: var(--gold); }
    .hk { font-size: 1.1rem; }
    .who { font-size: 1.05rem; }
    .who .faction { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--muted); }
    .who .faction.ALLIANCE { background: var(--alliance); }
    .who .faction.HORDE { background: var(--horde); }
    .detail { margin-top: 2px; color: var(--muted); font-size: 0.85rem; }
    .note { color: var(--muted); font-size: 0.85rem; }
    #status { margin-top: 16px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Honorable Kills</h1>
    <p class="sub">WoW Forever · US · updates when a character logs out · click a column to sort</p>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th class="rank">#</th>
            <th data-key="character" aria-sort="none"><button type="button" class="sort">Character</button></th>
            <th class="num" data-key="level" aria-sort="none"><button type="button" class="sort">Lvl</button></th>
            <th class="num" data-key="itemLevel" aria-sort="none"><button type="button" class="sort">iLvl</button></th>
            <th class="num" data-key="honorableKills" aria-sort="descending"><button type="button" class="sort">HK</button></th>
            <th class="num" data-key="pvpDeaths" aria-sort="none"><button type="button" class="sort">PvP deaths</button></th>
            <th class="num" data-key="ratio" aria-sort="none"><button type="button" class="sort">HK / death</button></th>
            <th class="num" data-key="pveDeaths" aria-sort="none"><button type="button" class="sort">PvE deaths</button></th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8" class="note">Loading…</td></tr></tbody>
      </table>
    </div>
    <div id="status"></div>
  </main>
  <script>
    const NOTES = {
      not_found: "Not visible yet (needs level 10 and a logout)",
      error: "Couldn't load",
    };

    // Standard WoW class colors.
    const CLASS_COLORS = {
      "Death Knight": "#C41F3B",
      Druid: "#FF7D0A",
      Hunter: "#ABD473",
      Mage: "#3FC7EB",
      Paladin: "#F58CBA",
      Priest: "#FFFFFF",
      Rogue: "#FFF569",
      Shaman: "#0070DE",
      Warlock: "#9482C9",
      Warrior: "#C79C6E",
    };

    // --- Sorting ---------------------------------------------------------------
    // `first` is the direction used the first time a column is clicked.
    const SORTS = {
      character: { value: (r) => nameOf(r).toLowerCase(), first: "asc" },
      level: { value: (r) => r.level, first: "desc" },
      itemLevel: { value: (r) => r.itemLevel, first: "desc" },
      honorableKills: { value: (r) => r.honorableKills, first: "desc" },
      pvpDeaths: { value: (r) => r.pvpDeaths, first: "desc" },
      ratio: { value: (r) => (r.pvpDeaths > 0 ? r.honorableKills / r.pvpDeaths : null), first: "desc" },
      pveDeaths: { value: (r) => r.pveDeaths, first: "desc" },
    };

    let rows = null;                                  // set once the data has loaded
    let ranks = new Map();                            // HK rank per row, independent of sorting
    let sort = { key: "honorableKills", dir: "desc" };
    const expanded = new Set();                       // characters whose PvE breakdown is open

    const nameOf = (r) => `${r.name} ${r.surname}`;
    const isRanked = (r) => r.status === "ok" && r.honorableKills != null;
    const byHk = (a, b) => b.honorableKills - a.honorableKills;
    const tiebreak = (a, b) => byHk(a, b) || nameOf(a).localeCompare(nameOf(b));

    // Ties share a rank (1, 1, 3). Based on HK only, so re-sorting never changes it.
    function computeRanks(all) {
      const ordered = all.filter(isRanked).sort(byHk);
      const map = new Map();
      ordered.forEach((row, i) => {
        const prev = ordered[i - 1];
        map.set(row, prev && prev.honorableKills === row.honorableKills ? map.get(prev) : i + 1);
      });
      return map;
    }

    function sortedRows() {
      const ranked = rows.filter(isRanked);
      const unranked = rows.filter((r) => !isRanked(r)); // always stay at the bottom
      const { value } = SORTS[sort.key];
      const sign = sort.dir === "asc" ? 1 : -1;
      ranked.sort((a, b) => {
        const av = value(a);
        const bv = value(b);
        if (av == null && bv == null) return tiebreak(a, b);
        if (av == null) return 1; // missing values go last in either direction
        if (bv == null) return -1;
        const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
        return cmp !== 0 ? sign * cmp : tiebreak(a, b);
      });
      return [...ranked, ...unranked];
    }

    function updateHeaders() {
      for (const th of document.querySelectorAll("th[data-key]")) {
        th.setAttribute(
          "aria-sort",
          th.dataset.key === sort.key ? (sort.dir === "asc" ? "ascending" : "descending") : "none"
        );
      }
    }

    for (const th of document.querySelectorAll("th[data-key]")) {
      th.querySelector("button").addEventListener("click", () => {
        if (!rows) return; // still loading
        const key = th.dataset.key;
        sort = key === sort.key
          ? { key, dir: sort.dir === "asc" ? "desc" : "asc" }
          : { key, dir: SORTS[key].first };
        render();
      });
    }

    // --- Rendering -------------------------------------------------------------
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function characterCell(row) {
      const td = el("td");
      const who = el("div", "who");
      who.append(el("span", "faction" + (row.faction ? " " + row.faction : "")));
      who.append(document.createTextNode(nameOf(row)));
      td.append(who);

      const bits = [];
      if (row.race) bits.push(row.race);
      const detail = el("div", "detail");
      detail.append(document.createTextNode(bits.join(" ") + (bits.length && row.className ? " " : "")));
      if (row.className) {
        const cls = el("span", null, row.className);
        cls.style.color = CLASS_COLORS[row.className] || "inherit";
        detail.append(cls);
      }
      if (row.guild) detail.append(document.createTextNode(` · <${row.guild}>`));
      if (detail.textContent) td.append(detail);
      return td;
    }

    function ratio(row) {
      if (!row.pvpDeaths) return "–";
      return (row.honorableKills / row.pvpDeaths).toFixed(1);
    }

    function fmt(n) {
      return n != null ? n.toLocaleString() : "–";
    }

    // The PvE deaths count; clicking it opens the breakdown row underneath.
    function pveCell(row, detail) {
      const td = el("td", "num");
      if (row.pveDeaths == null) {
        td.textContent = "–";
        return td;
      }
      if (!detail) {
        td.textContent = row.pveDeaths.toLocaleString();
        return td;
      }
      const key = nameOf(row).toLowerCase();
      detail.hidden = !expanded.has(key);
      const btn = el("button", "toggle", row.pveDeaths.toLocaleString() + " ▾");
      btn.type = "button";
      btn.setAttribute("aria-expanded", String(!detail.hidden));
      btn.addEventListener("click", () => {
        detail.hidden = !detail.hidden;
        if (detail.hidden) expanded.delete(key);
        else expanded.add(key);
        btn.setAttribute("aria-expanded", String(!detail.hidden));
      });
      td.append(btn);
      return td;
    }

    function breakdownRow(row) {
      const tr = el("tr", "breakdown");
      tr.hidden = true;
      const td = el("td");
      td.colSpan = 8;
      td.append(el("div", "note", "PvE death counters (some overlap, e.g. dungeon deaths are also counted in wider totals)"));
      const list = el("ul", "chips");
      for (const d of row.deathBreakdown) {
        list.append(el("li", null, `${d.name}: ${d.quantity.toLocaleString()}`));
      }
      td.append(list);
      tr.append(td);
      return tr;
    }

    function render() {
      const body = document.getElementById("rows");
      body.replaceChildren();
      for (const row of sortedRows()) {
        const tr = el("tr");
        const ranked = isRanked(row);
        const rank = ranks.get(row);
        if (ranked && rank === 1) tr.className = "first";
        tr.append(el("td", "rank", ranked ? rank : "–"), characterCell(row));
        let detail = null;
        if (ranked) {
          const hasBreakdown = row.deathBreakdown && row.deathBreakdown.length > 0;
          detail = hasBreakdown ? breakdownRow(row) : null;
          tr.append(
            el("td", "num", fmt(row.level)),
            el("td", "num", fmt(row.itemLevel)),
            el("td", "num hk", row.honorableKills.toLocaleString()),
            el("td", "num", fmt(row.pvpDeaths)),
            el("td", "num", ratio(row)),
            pveCell(row, detail)
          );
        } else {
          const note = el("td", "num note", NOTES[row.status] || "");
          note.colSpan = 6;
          tr.append(note);
        }
        body.append(tr);
        if (detail) body.append(detail);
      }
      updateHeaders();
    }

    async function load() {
      const body = document.getElementById("rows");
      const status = document.getElementById("status");
      try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        rows = data.rows;
        ranks = computeRanks(rows);
        render();
        status.textContent =
          "Updated " + new Date(data.updatedAt).toLocaleString() +
          (data.stale ? " · Blizzard isn't responding right now, so this is the last good data" : "");
      } catch (err) {
        body.replaceChildren();
        const tr = el("tr");
        const td = el("td", "note", "Couldn't load the leaderboard: " + err.message);
        td.colSpan = 8;
        tr.append(td);
        body.append(tr);
      }
    }
    load();
  </script>
</body>
</html>
